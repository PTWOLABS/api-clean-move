name: Linting

on: pull_request

permissions:
  contents: read

jobs:
  validate-pr-flow:
    name: Validate PR Flow
    uses: ./.github/workflows/validate-pr-flow.yml

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci

      - run: npm run format:check

  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api-clean-move
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci
      - run: npm run prisma:generate

      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api-clean-move
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci
      - run: npm run prisma:generate

      - run: npm run typecheck
